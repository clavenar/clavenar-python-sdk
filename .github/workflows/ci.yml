name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ruff / mypy / pytest / build (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: ruff check
        run: ruff check

      - name: ruff format --check
        run: ruff format --check

      # mypy is pinned to py3.10 in pyproject.toml — running it under
      # every matrix interpreter would just re-check the same surface.
      # Keep it scoped to one job so feedback stays focused.
      - name: mypy
        if: matrix.python-version == '3.10'
        run: mypy src/clavenar_agent_sdk

      - name: pytest
        run: pytest

      - name: build sdist + wheel
        run: python -m build

  # Same posture as the Go/Java/.NET siblings, which all scan in the PR
  # path — this package ships to PyPI and had no vuln/SBOM gate here.
  supply-chain:
    name: pip-audit + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install package + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit cyclonedx-bom

      - name: pip-audit
        run: pip-audit

      - name: generate CycloneDX SBOM
        run: cyclonedx-py environment -o bom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json
