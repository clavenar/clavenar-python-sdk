name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ruff / mypy / pytest / build (py${{ matrix.python-version }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.20", "3.11.15", "3.12.13", "3.13.14"]
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: install dev extras
        run: |
          uv pip install -e ".[dev]"
          uv pip install build==1.5.0

      - name: ruff check
        run: ruff check

      - name: ruff format --check
        run: ruff format --check

      # mypy is pinned to py3.10 in pyproject.toml — running it under
      # every matrix interpreter would just re-check the same surface.
      # Keep it scoped to one job so feedback stays focused.
      - name: mypy
        if: matrix.python-version == '3.10.20'
        run: mypy src/clavenar_agent_sdk

      - name: pytest
        run: pytest

      - name: build sdist + wheel
        run: python -m build

  # Same posture as the Go/Java/.NET siblings, which all scan in the PR
  # path — this package ships to PyPI and had no vuln/SBOM gate here.
  supply-chain:
    name: pip-audit + SBOM
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          python-version: "3.12.13"
          activate-environment: true

      - name: install package + tooling
        run: |
          uv pip install -e .
          uv pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0

      - name: pip-audit
        run: pip-audit

      - name: generate CycloneDX SBOM
        run: cyclonedx-py environment -o bom.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: bom.json
