name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ruff / mypy / pytest / build (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.20", "3.11.15", "3.12.13", "3.13.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install dev extras
        run: |
          python -m pip install pip==26.1.2
          pip install -e ".[dev]"
          pip install build==1.5.0

      - name: ruff check
        run: ruff check

      - name: ruff format --check
        run: ruff format --check

      # mypy is pinned to py3.10 in pyproject.toml — running it under
      # every matrix interpreter would just re-check the same surface.
      # Keep it scoped to one job so feedback stays focused.
      - name: mypy
        if: matrix.python-version == '3.10'
        run: mypy src/clavenar_agent_sdk

      - name: pytest
        run: pytest

      - name: build sdist + wheel
        run: python -m build

  # Same posture as the Go/Java/.NET siblings, which all scan in the PR
  # path — this package ships to PyPI and had no vuln/SBOM gate here.
  supply-chain:
    name: pip-audit + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip

      - name: install package + tooling
        run: |
          python -m pip install pip==26.1.2
          pip install -e .
          pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0

      - name: pip-audit
        run: pip-audit

      - name: generate CycloneDX SBOM
        run: cyclonedx-py environment -o bom.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: bom.json
