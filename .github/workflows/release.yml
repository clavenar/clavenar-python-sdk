name: release
run-name: publish ${{ github.event.client_payload.publication_id }}

on:
  repository_dispatch:
    types: [clavenar-protected-publication]

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    environment: pypi
    permissions:
      contents: write
      # OIDC token for PyPI Trusted Publishing.
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.client_payload.source_sha }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          python-version: '3.10.20'
          activate-environment: true

      - name: Verify protected publication input
        env:
          COMPONENT_VERSION: ${{ github.event.client_payload.component_version }}
          RELEASE_REFERENCE: ${{ github.event.client_payload.release_reference }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          test "$GITHUB_ACTOR" = "vanteguardlabs"
          [[ "$RELEASE_REFERENCE" =~ ^ghcr\.io/clavenar/clavenar-stack-release@sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          PKG="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"
          if [ "$COMPONENT_VERSION" != "$PKG" ]; then
            echo "::error::protected component version does not match pyproject.toml '$PKG'"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          uv pip install '.[dev]' build==1.5.0
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/clavenar_agent_sdk
          python -m pytest
          python -m build

      - name: Check whether this exact version is already public
        id: registry
        run: |
          code="$(curl -sS -o /tmp/pypi-version.json -w '%{http_code}' \
            'https://pypi.org/pypi/clavenar-agent-sdk/${{ github.event.client_payload.component_version }}/json')"
          if [ "$code" = 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 404 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/pypi-version.json >&2
            exit 1
          fi

      - name: Publish to PyPI with trusted OIDC
        if: steps.registry.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

      - name: Publish the exact source tag and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.client_payload.component_version }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha')" = "$SOURCE_SHA"
            gh release upload "$tag" dist/* --clobber
          else
            existing="$(git ls-remote --refs origin "refs/tags/$tag" |
              awk '{print $1}')"
            if [ -n "$existing" ]; then
              test "$existing" = "$SOURCE_SHA"
            else
              git push origin "$SOURCE_SHA:refs/tags/$tag"
            fi
            gh release create "$tag" --verify-tag \
              --title "$tag — clavenar-agent-sdk" \
              --notes "Published from the accepted protected Clavenar release." \
              dist/*
          fi
